services:
  replication-node-1:
    build: ./app
    container_name: replication-node-1
    hostname: replication-node-1
    environment:
      NODE_ID: node-1
      PORT: 8080
      PEERS: http://replication-node-2:8080,http://replication-node-3:8080
    ports:
      - "8080:8080"
    networks:
      - distributed-net

  replication-node-2:
    build: ./app
    container_name: replication-node-2
    hostname: replication-node-2
    environment:
      NODE_ID: node-2
      PORT: 8080
      PEERS: http://replication-node-1:8080,http://replication-node-3:8080
    ports:
      - "8081:8080"
    networks:
      - distributed-net

  replication-node-3:
    build: ./app
    container_name: replication-node-3
    hostname: replication-node-3
    environment:
      NODE_ID: node-3
      PORT: 8080
      PEERS: http://replication-node-1:8080,http://replication-node-2:8080
    ports:
      - "8082:8080"
    networks:
      - distributed-net

networks:
  distributed-net:
    external: true
    name: distributed-net
